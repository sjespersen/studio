<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in · Studio</title>
<style>
:root { --bg:#f4f4f1; --card:#fff; --ink:#1c1c1a; --muted:#6b6b64; --line:#e4e4de; --accent:#2f6f4f; }
@media (prefers-color-scheme: dark) { :root { --bg:#121211; --card:#1c1c1a; --ink:#ecece6; --muted:#a3a39b; --line:#2e2e2b; } }
body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui, -apple-system, sans-serif; }
form { max-width:360px; margin:12vh auto; padding:24px; background:var(--card); border:1px solid var(--line); border-radius:12px; }
h1 { margin:0 0 4px; font-size:20px; } p { margin:0 0 16px; color:var(--muted); }
label { display:block; margin-bottom:6px; color:var(--muted); font-size:13px; }
input[type=password] { box-sizing:border-box; width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); font:inherit; }
button { margin-top:14px; width:100%; padding:9px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
.err { color:#c0392b; margin:0 0 12px; }
</style></head><body>
<form method="post" action="/_ai/login">
<h1>Studio</h1><p>Sign in with the API key.</p>
<p class="err" id="wrong" hidden>That key is wrong.</p>
<label for="key">API key (the Studio's <code>API_KEY</code>)</label>
<input id="key" name="key" type="password" autocomplete="current-password" autofocus>
<input type="hidden" name="next" id="next"><button>Sign in</button></form>
<script>
const q = new URLSearchParams(location.search);
document.getElementById('next').value = q.get('next') || '/';
document.getElementById('wrong').hidden = !q.get('wrong');
</script></body></html>
